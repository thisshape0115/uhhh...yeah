name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and build APK
        run: |
          # gradlew 위치 자동 탐색
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ gradlew 파일을 찾을 수 없습니다."
            echo "📂 현재 디렉토리 구조:"
            find . -type f | head -30
            exit 1
          fi
          
          echo "✅ gradlew 발견: $GRADLEW_PATH"
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
