name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project
        run: |
          ZIP_PATH=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          echo "✅ ZIP 발견: $ZIP_PATH"
          unzip -o "$ZIP_PATH" -d ./project

      - name: Fix Gradle version
        run: |
          GRADLEW_PATH=$(find ./project -name "gradlew" -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          # gradle-wrapper.properties에서 버전 강제 변경
          WRAPPER_PROPS=$(find "$PROJECT_DIR" -name "gradle-wrapper.properties" | head -1)
          echo "📄 wrapper 경로: $WRAPPER_PROPS"
          cat "$WRAPPER_PROPS"
          
          # Gradle 8.7로 다운그레이드
          sed -i 's|gradle-[0-9]*\.[0-9]*\(\.[0-9]*\)*-[a-z]*\.zip|gradle-8.7-bin.zip|g' "$WRAPPER_PROPS"
          echo "✅ 변경 후:"
          cat "$WRAPPER_PROPS"

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find ./project -name "gradlew" -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
