name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 구버전 환경 사용

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Unzip project
        run: |
          ZIP_PATH=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          echo "✅ ZIP 발견: $ZIP_PATH"
          unzip -o "$ZIP_PATH" -d ./project

      - name: Patch gradle-wrapper.properties
        run: |
          WRAPPER_PROPS=$(find ./project -name "gradle-wrapper.properties" | head -1)
          echo "현재 내용:"
          cat "$WRAPPER_PROPS"
          # 통째로 덮어쓰기
          cat > "$WRAPPER_PROPS" << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          echo "변경 후:"
          cat "$WRAPPER_PROPS"

      - name: Build APK (use system Gradle, bypass wrapper)
        run: |
          GRADLEW_PATH=$(find ./project -name "gradlew" -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          # gradlew 대신 직접 설치한 gradle 8.7 사용
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
