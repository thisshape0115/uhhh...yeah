name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Unzip project
        run: |
          ZIP_PATH=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          echo "ZIP 발견: $ZIP_PATH"
          unzip -o "$ZIP_PATH" -d ./project

      - name: Patch gradle-wrapper.properties
        run: |
          WRAPPER_PROPS=$(find ./project -name "gradle-wrapper.properties" | head -1)
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > "$WRAPPER_PROPS"

      - name: Show build.gradle and patch
        run: |
          BUILD_GRADLE=$(find ./project -path "*/app/build.gradle" | head -1)
          echo "PATH: $BUILD_GRADLE"
          echo "===== BEFORE ====="
          cat "$BUILD_GRADLE"
          echo "===== END ====="

          python3 -c "
          import re, subprocess
          result = subprocess.run(['find', './project', '-path', '*/app/build.gradle'], capture_output=True, text=True)
          path = result.stdout.strip().split('\n')[0]
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'compileSdk\s*[=]?\s*\d+', 'compileSdk = 34', content)
          content = re.sub(r'compileSdkVersion\s*[=]?\s*\d+', 'compileSdkVersion = 34', content)
          content = re.sub(r'targetSdk\s*[=]?\s*\d+', 'targetSdk = 34', content)
          content = re.sub(r'targetSdkVersion\s*[=]?\s*\d+', 'targetSdkVersion = 34', content)
          with open(path, 'w') as f:
              f.write(content)
          print('PATCHED:')
          print(content)
          "

      - name: Install Android SDK platform 34
        run: |
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find ./project -name "gradlew" -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
