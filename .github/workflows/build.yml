name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7 directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Unzip project
        run: |
          ZIP_PATH=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          echo "ZIP 발견: $ZIP_PATH"
          unzip -o "$ZIP_PATH" -d ./project

      - name: Patch gradle-wrapper.properties
        run: |
          WRAPPER_PROPS=$(find ./project -name "gradle-wrapper.properties" | head -1)
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > "$WRAPPER_PROPS"

      - name: Show and patch app/build.gradle
        run: |
          BUILD_GRADLE=$(find ./project -path "*/app/build.gradle" | head -1)
          echo "===== 현재 build.gradle 내용 ====="
          cat "$BUILD_GRADLE"
          echo "=================================="

          python3 << 'PYEOF'
          import re, sys

          path = None
          import subprocess
          result = subprocess.run(['find', './project', '-path', '*/app/build.gradle'], capture_output=True, text=True)
          path = result.stdout.strip().split('\n')[0]
          print(f"수정할 파일: {path}")

          with open(path, 'r') as f:
              content = f.read()

          # compileSdk 교체 (공백/등호 방식 모두)
          content = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 34', content)
          content = re.sub(r'compileSdkVersion\s*=?\s*\d+', 'compileSdkVersion = 34', content)
          # targetSdk 교체
          content = re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk = 34', content)
          content = re.sub(r'targetSdkVersion\s*=?\s*\d+', 'targetSdkVersion = 34', content)

          with open(path, 'w') as f:
              f.write(content)

          print("===== 수정 후 build.gradle =====")
          print(content)
          PYEOF

      - name: Build APK
        run: |
          GRADLEW_PATH=$(find ./project -name "gradlew" -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
