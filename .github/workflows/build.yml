name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project
        run: |
          ZIP_PATH=$(find . -name "*.zip" -not -path "./.git/*" | head -1)
          
          if [ -z "$ZIP_PATH" ]; then
            echo "❌ ZIP 파일을 찾을 수 없습니다."
            exit 1
          fi
          
          echo "✅ ZIP 발견: $ZIP_PATH"
          unzip -o "$ZIP_PATH" -d ./project

      - name: Find and build APK
        run: |
          GRADLEW_PATH=$(find ./project -name "gradlew" -type f | head -1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ gradlew 파일을 찾을 수 없습니다."
            echo "📂 압축 해제된 구조:"
            find ./project -type f | head -30
            exit 1
          fi
          
          echo "✅ gradlew 발견: $GRADLEW_PATH"
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
